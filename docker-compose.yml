name: student-fitnesstracker

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: student-dnedelcu-db
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: fitnesstracker-demo-pass-2026
      MSSQL_DB: fitnesstracker
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"fitnesstracker-demo-pass-2026\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - studlab_net
    restart: unless-stopped

  api:
    build:
      context: . 
    container_name: student-dnedelcu-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=student-dnedelcu-db,1433;Database=fitnesstracker;User Id=sa;Password=fitnesstracker-demo-pass-2026;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    expose:
      - "8080"
    networks:
      - studlab_net
    restart: unless-stopped

volumes:
  db_data:

networks:
  studlab_net:
    external: true
    name: studlab_net